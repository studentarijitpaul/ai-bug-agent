name: Bug Agent Workflow (Offline Analysis, Approvals & Sandboxing)

"on":
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to execute"
        required: true
        type: choice
        options:
          - analyze_and_request
          - analyze_only
          - check_replies
          - status
          - send_issue
          - generate_patch
          - run_tests
          - request_publication
        default: analyze_and_request
      issue_limit:
        description: "Maximum issues to fetch per configured repository"
        required: true
        default: "5"
        type: choice
        options: ["1", "5", "10", "20", "30"]
      target_id:
        description: "Target Task ID or Issue Number (for send_issue, generate_patch, run_tests)"
        required: false
        type: string
        default: ""
      recipient_email:
        description: "Optional recipient email override (overrides APPROVER_EMAIL secret)"
        required: false
        type: string
        default: ""
      mock_gmail:
        description: "Force mock Gmail mode (simulated queue, no Google OAuth secrets needed)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: bug-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore persistent task database & state cache
        uses: actions/cache@v4
        with:
          path: |
            .agent-state/
            reports/
          key: ${{ runner.os }}-bug-agent-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-bug-agent-${{ github.ref_name }}-
            ${{ runner.os }}-bug-agent-

      - name: Install bug agent and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"

      - name: Execute Bug Agent Operation
        id: execute-agent
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          APPROVER_EMAIL: ${{ secrets.APPROVER_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_PATH: .agent-state/tasks.db
          STATE_JSON_PATH: .agent-state/state.json
          OPERATION: ${{ inputs.operation }}
          ISSUE_LIMIT: ${{ inputs.issue_limit }}
          TARGET_ID: ${{ inputs.target_id }}
          RECIPIENT_EMAIL: ${{ inputs.recipient_email }}
          FORCE_MOCK_GMAIL: ${{ inputs.mock_gmail }}
        shell: bash
        run: |
          mkdir -p .agent-state reports/patches

          # Configure Gmail parameters
          GMAIL_ARGS=()
          EFFECTIVE_EMAIL="${RECIPIENT_EMAIL:-$APPROVER_EMAIL}"

          if [[ "$FORCE_MOCK_GMAIL" == "true" || -z "${GMAIL_TOKEN_JSON:-}" || -z "${EFFECTIVE_EMAIL:-}" ]]; then
            echo "[INFO] Live Gmail secrets not fully configured or mock requested; using mock Gmail mode."
            GMAIL_ARGS+=(--mock-gmail)
            if [[ -z "${EFFECTIVE_EMAIL:-}" ]]; then
              EFFECTIVE_EMAIL="approver@example.com"
            fi
          fi

          if [[ -n "${EFFECTIVE_EMAIL:-}" ]]; then
            GMAIL_ARGS+=(--email "$EFFECTIVE_EMAIL")
          fi

          echo "============================================================"
          echo " Starting Bug Agent Run"
          echo " Operation:    $OPERATION"
          echo " Issue Limit:  $ISSUE_LIMIT"
          echo " Target ID:    ${TARGET_ID:-N/A}"
          echo " Approver:     $EFFECTIVE_EMAIL"
          echo " Gmail Mode:   $(if [[ "${GMAIL_ARGS[*]}" == *"--mock-gmail"* ]]; then echo "MOCK"; else echo "LIVE OAUTH"; fi)"
          echo "============================================================"

          case "$OPERATION" in
            analyze_and_request)
              bug-agent --config repos.json --limit "$ISSUE_LIMIT" --analyze --ai-provider mock --request-approvals "${GMAIL_ARGS[@]}"
              ;;
            analyze_only)
              bug-agent --config repos.json --limit "$ISSUE_LIMIT" --analyze --ai-provider mock
              ;;
            check_replies)
              bug-agent --config repos.json --limit "$ISSUE_LIMIT" --ai-provider mock --check-approvals "${GMAIL_ARGS[@]}"
              ;;
            status)
              bug-agent --status
              ;;
            send_issue)
              if [[ -z "$TARGET_ID" ]]; then
                echo "Error: target_id is required for send_issue." >&2
                exit 1
              fi
              bug-agent --send-issue "$TARGET_ID" "${GMAIL_ARGS[@]}"
              ;;
            generate_patch)
              if [[ -z "$TARGET_ID" ]]; then
                echo "Error: target_id is required for generate_patch." >&2
                exit 1
              fi
              bug-agent --generate-patch "$TARGET_ID"
              ;;
            run_tests)
              if [[ -z "$TARGET_ID" ]]; then
                echo "Error: target_id is required for run_tests." >&2
                exit 1
              fi
              bug-agent --run-tests "$TARGET_ID" --mock-sandbox
              ;;
            request_publication)
              bug-agent --request-publication "${GMAIL_ARGS[@]}"
              ;;
            *)
              echo "Error: Unsupported operation '$OPERATION'." >&2
              exit 2
              ;;
          esac

      - name: Generate GitHub Actions Step Summary
        if: always()
        env:
          OPERATION: ${{ inputs.operation }}
          ISSUE_LIMIT: ${{ inputs.issue_limit }}
          TARGET_ID: ${{ inputs.target_id }}
          DATABASE_PATH: .agent-state/tasks.db
        shell: bash
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 🤖 AI Bug Agent Execution Summary

          | Setting | Value |
          |---|---|
          | **Operation** | `${{ inputs.operation }}` |
          | **Issue Limit** | `${{ inputs.issue_limit }}` |
          | **Target ID** | `${{ inputs.target_id || 'None specified' }}` |
          | **Scope** | `https://github.com/pytorch/ignite` (Locked) |
          | **Analysis Provider** | `mock` (Offline Deterministic Heuristics) |

          ### 📋 Database Task & Approval Status
          ```text
          EOF

          if [[ -f ".agent-state/tasks.db" ]]; then
            bug-agent --db-path .agent-state/tasks.db --status >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "Could not read status" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No database file initialized yet." >> "$GITHUB_STEP_SUMMARY"
          fi

          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ```

          > **Security Policy**:
          > - Analysis is strictly deterministic and performed offline. No external paid AI keys are used.
          > - Scope is strictly restricted to `pytorch/ignite`.
          > - Unattended pull request publication is disabled by design.
          EOF

      - name: Upload Task Database and Generated Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug-agent-artifacts-${{ github.run_id }}
          path: |
            .agent-state/
            reports/
          retention-days: 14
