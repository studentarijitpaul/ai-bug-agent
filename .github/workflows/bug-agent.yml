name: Bug agent (manual, offline analysis)

on:
  workflow_dispatch:
    inputs:
      issue_limit:
        description: Maximum issues to fetch per configured repository
        required: true
        default: "5"
        type: choice
        options: ["1", "5", "10", "20"]

permissions:
  contents: read

concurrency:
  group: bug-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Run existing CLI in offline analysis-only mode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_PATH: ${{ runner.temp }}/bug-agent/tasks.db
          ISSUE_LIMIT: ${{ inputs.issue_limit }}
        run: |
          bug-agent --config repos.json --limit "$ISSUE_LIMIT" --analyze --ai-provider mock
          echo '## Bug agent run' >> "$GITHUB_STEP_SUMMARY"
          echo '- Mode: offline mock analysis' >> "$GITHUB_STEP_SUMMARY"
          echo "- Issue limit per repository: $ISSUE_LIMIT" >> "$GITHUB_STEP_SUMMARY"
          echo '- No approval email, patch, test, publication, or merge was requested.' >> "$GITHUB_STEP_SUMMARY"
